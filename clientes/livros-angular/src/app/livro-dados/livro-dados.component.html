<main class="container">
  <h1>Dados do Livro</h1>
  <form (submit)="incluir()" ngNativeValidate>
    <div class="mb-3">
      <label for="titulo" class="form-label">Título</label>
      <input type="text" class="form-control" id="titulo" name="titulo" [(ngModel)]="livro.titulo" required>
    </div>
    <div class="mb-3">
      <label for="resumo" class="form-label">Resumo</label>
      <textarea class="form-control" id="resumo" name="resumo" [(ngModel)]="livro.resumo"></textarea>
    </div>
    <div class="mb-3">
      <label for="codEditora" class="form-label">Editora</label>
      <select class="form-select" id="codEditora" name="codEditora" [(ngModel)]="livro.codEditora" required>
        <option value="" disabled>Selecione...</option>
        <option *ngFor="let editora of editoras" [ngValue]="editora.codEditora">{{ editora.nome }}</option>
      </select>
    </div>
    <div class="mb-3">
      <label for="autoresForm" class="form-label">Autores (1 por linha)</label>
      <textarea class="form-control" id="autoresForm" name="autoresForm" [(ngModel)]="autoresForm"
        placeholder="Um autor por linha"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Incluir</button>
  </form>
</main>
